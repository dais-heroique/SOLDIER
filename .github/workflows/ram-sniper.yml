name: RAM Sniper (scan planifié)

# Un passage toutes les ~10 minutes : scan Vinted + Leboncoin, filtre vendeur
# (≥ 1 avis), notifications Telegram. Gratuit sur un dépôt PUBLIC.
#
# Anti-blocage (README §10) : chaque requête bloquée repart aussitôt par la
# sortie réseau suivante — direct → maison (Tailscale) → WARP → proxys — et
# l'état des sorties est gardé d'un passage à l'autre.
#
# Secrets (Settings → Secrets and variables → Actions) :
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   obligatoires
#   GEMINI_API_KEY                         facultatif : analyse des photos
#   TS_AUTHKEY, TS_EXIT_NODE               facultatif : sortie maison (gratuit)
#   SNIPER_PROXY_URLS                      facultatif : proxys payants
# Variable (onglet Variables) : SNIPER_WARP = auto (défaut) | toujours | jamais

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub peut retarder ou sauter des passages (README §10)
  workflow_dispatch:

concurrency:
  group: ram-sniper
  cancel-in-progress: false    # jamais deux passages en parallèle (double requêtes)

permissions:
  contents: read
  actions: write               # pour garder le planificateur actif (dernière étape)

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      SNIPER_PROXY_URLS: ${{ secrets.SNIPER_PROXY_URLS }}
      SNIPER_PROXY_URL: ${{ secrets.SNIPER_PROXY_URL }}
      SNIPER_WARP: ${{ vars.SNIPER_WARP || 'auto' }}
      SNIPER_MIN_REVIEWS: "1"  # nombre d'avis minimum du vendeur (0 = désactivé)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base (annonces vues, stock, quotas) et l'état des sorties réseau
      # passent d'un passage à l'autre par le cache GitHub. Restauration et
      # sauvegarde séparées : la sauvegarde a lieu MÊME si le passage échoue,
      # sinon le bot oublierait quelles sorties sont bloquées.
      - name: Restaurer la base et l'état réseau
        uses: actions/cache/restore@v4
        with:
          path: |
            soldier.db
            .sorties_etat.json
          key: soldier-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soldier-db-

      - name: Sorties réseau de secours
        run: bash outils/sorties_secours.sh
        continue-on-error: true

      - name: Références de prix (idempotent)
        run: python ram_sniper.py --seed

      - name: Scan
        run: python ram_sniper.py --ci

      - name: Sauvegarder la base et l'état réseau
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            soldier.db
            .sorties_etat.json
          key: soldier-db-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub désactive les workflows planifiés d'un dépôt sans activité
      # depuis 60 jours. Réactiver le workflow à chaque passage remet le
      # compteur à zéro ; le résumé Telegram quotidien sert de contrôle.
      - name: Garder le planificateur actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ram-sniper.yml --repo "${{ github.repository }}" || true
