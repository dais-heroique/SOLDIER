name: RAM Sniper (en continu)

# Le bot tourne SANS ARRÊT pendant la plage horaire, comme sur un ordinateur :
# une session de ~5 h 20 (un job GitHub est limité à 6 h), puis la suivante
# prend le relais toute seule. Vinted et Leboncoin sont scannés en parallèle,
# les recherches larges toutes les 12-40 s, et chaque affaire part sur
# Telegram dès qu'elle est évaluée. Gratuit sur un dépôt PUBLIC.
#
# Le cron ne lance plus de passage : il sert de CHIEN DE GARDE. Toutes les
# 10 min il vérifie qu'une session tourne, et en démarre une sinon (début de
# journée, session tombée).
#
# Anti-blocage (README §10) : chaque requête bloquée repart aussitôt par la
# sortie réseau suivante — direct → maison (Tailscale) → WARP → proxys.
#
# Secrets (Settings → Secrets and variables → Actions) :
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID   obligatoires
#   GEMINI_API_KEY                         facultatif : analyse des photos
#   TS_AUTHKEY, TS_EXIT_NODE               facultatif : sortie maison (gratuit)
#   SNIPER_PROXY_URLS                      facultatif : proxys payants
# Variables (onglet Variables) :
#   SNIPER_WARP    auto (défaut) | toujours | jamais
#   SNIPER_HEURES  plage horaire, heure de Paris, fin exclue (défaut 7-23 ;
#                  « 0-24 » = tout le temps). Un lancement manuel hors plage
#                  tourne 15 min, pour tester.

on:
  schedule:
    # Cron en UTC, volontairement large (couvre 7h-23h Paris été comme hiver) ;
    # la plage exacte est vérifiée à chaque passage (job « plage »).
    - cron: "*/10 5-21 * * *"  # chien de garde (GitHub peut le retarder de quelques minutes)
  workflow_dispatch:
    inputs:
      relais:
        description: "Relais automatique entre deux sessions (laisser vide à la main)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write               # relais entre sessions + planificateur gardé actif

jobs:
  # Décide, en quelques secondes et sans rien installer, si l'heure (Paris)
  # est dans la plage : sinon le job « scan » n'est même pas démarré.
  plage:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      actif: ${{ steps.heure.outputs.actif }}
    steps:
      - id: heure
        env:
          EVENEMENT: ${{ github.event_name }}
          SNIPER_HEURES: ${{ vars.SNIPER_HEURES || '7-23' }}
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          CE_RUN: ${{ github.run_id }}
        run: |
          h="$(TZ=Europe/Paris date +%-H)"
          debut="${SNIPER_HEURES%-*}"; fin="${SNIPER_HEURES#*-}"
          actif=false
          if [ "$EVENEMENT" = "workflow_dispatch" ] || [ "$debut" = "$fin" ]; then
            actif=true
          elif [ "$debut" -lt "$fin" ]; then
            if [ "$h" -ge "$debut" ] && [ "$h" -lt "$fin" ]; then actif=true; fi
          else
            if [ "$h" -ge "$debut" ] || [ "$h" -lt "$fin" ]; then actif=true; fi
          fi
          # Chien de garde : si une session tourne (ou attend) déjà, ne rien lancer.
          if [ "$actif" = "true" ] && [ "$EVENEMENT" = "schedule" ]; then
            autres="$(gh api "repos/${DEPOT}/actions/workflows/ram-sniper.yml/runs?per_page=30" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != ${CE_RUN})] | length" \
              2>/dev/null || echo 0)"
            if [ "${autres:-0}" -gt 0 ]; then
              echo "Une session tourne déjà (${autres}) : rien à lancer."
              actif=false
            fi
          fi
          echo "Heure à Paris : ${h}h — plage ${SNIPER_HEURES} — actif=${actif}"
          echo "actif=${actif}" >> "$GITHUB_OUTPUT"

  scan:
    needs: plage
    if: needs.plage.outputs.actif == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350       # la session s'arrête d'elle-même vers 5 h 20
    concurrency:
      group: ram-sniper        # jamais deux sessions en parallèle : la suivante attend
      cancel-in-progress: false
    env:
      TZ: Europe/Paris
      SNIPER_HEURES: ${{ vars.SNIPER_HEURES || '7-23' }}
      # Lancement manuel = test, même hors plage. Le relais automatique, lui,
      # respecte la plage.
      SNIPER_IGNORER_PLAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.relais == '' && '1' || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TS_EXIT_NODE: ${{ secrets.TS_EXIT_NODE }}
      SNIPER_PROXY_URLS: ${{ secrets.SNIPER_PROXY_URLS }}
      SNIPER_PROXY_URL: ${{ secrets.SNIPER_PROXY_URL }}
      SNIPER_WARP: ${{ vars.SNIPER_WARP || 'auto' }}
      SNIPER_MIN_REVIEWS: "1"  # nombre d'avis minimum du vendeur (0 = désactivé)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La base (annonces vues, stock, quotas) et l'état des sorties réseau
      # passent d'un passage à l'autre par le cache GitHub. Restauration et
      # sauvegarde séparées : la sauvegarde a lieu MÊME si le passage échoue,
      # sinon le bot oublierait quelles sorties sont bloquées.
      - name: Restaurer la base et l'état réseau
        uses: actions/cache/restore@v4
        with:
          path: |
            soldier.db
            .sorties_etat.json
          key: soldier-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: soldier-db-

      - name: Sorties réseau de secours
        run: bash outils/sorties_secours.sh
        continue-on-error: true

      - name: Références de prix (idempotent)
        run: python ram_sniper.py --seed

      - name: Session continue
        id: session
        # exec : Python reçoit lui-même le signal d'annulation de GitHub et
        # sauvegarde proprement (sinon c'est bash qui le reçoit, et Python
        # est tué sans prévenir).
        run: exec python ram_sniper.py --continu

      # Si la session a été tuée net (annulation, panne), les dernières
      # écritures sont encore dans le journal SQLite (soldier.db-wal), qui
      # n'est pas sauvegardé : on les fusionne dans soldier.db avant.
      - name: Consolider la base
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3
          if os.path.exists("soldier.db"):
              c = sqlite3.connect("soldier.db", timeout=20)
              print("checkpoint :", c.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone())
              c.close()
          PY
        continue-on-error: true

      - name: Sauvegarder la base et l'état réseau
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            soldier.db
            .sorties_etat.json
          key: soldier-db-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub désactive les workflows planifiés d'un dépôt sans activité
      # depuis 60 jours. Réactiver le workflow à chaque session remet le
      # compteur à zéro ; le résumé Telegram quotidien sert de contrôle.
      - name: Garder le planificateur actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable ram-sniper.yml --repo "${{ github.repository }}" || true

      # Les alertes envoyées (2 derniers jours), pour les relire et régler les
      # seuils : Actions → le run → « alertes-envoyees ».
      - name: Exporter les alertes envoyées
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alertes-envoyees
          path: alertes-envoyees.json
          if-no-files-found: ignore
          retention-days: 14

      # Relais : la session s'est arrêtée à sa durée maximale, en pleine plage
      # horaire → on lance la suivante tout de suite (elle reprend la base
      # sauvegardée juste au-dessus). Si ce relais échoue, le chien de garde
      # (cron) relance dans les 10 minutes.
      - name: Relais vers la session suivante
        if: steps.session.outputs.relais == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ram-sniper.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f relais=1
