name: Test réseau (Vinted + Leboncoin)

# À lancer UNE fois à la main, avant d'activer le scan planifié :
# onglet Actions → « Test réseau » → Run workflow.
# Il dit si Vinted et Leboncoin répondent depuis les serveurs GitHub et si les
# avis vendeurs sont bien lus. Rouge = IP bloquée (voir README §10).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SNIPER_PROXY_URL: ${{ secrets.SNIPER_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python diag_vendeur.py
